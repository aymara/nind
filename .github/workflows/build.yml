on:
  push:
    branches:
    - master
    tags:
    - '*'
    
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  
  #========================================================================
  debian11_nind:
    name: "Build the package for Debian 11"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - name: Build image
        run: docker build -f ./Dockerfile-debian11 -t aymara/nind-debian11:build .
      - name: Extract package and version number from docker image
        id: extract
        shell: bash
        run: |
             dockerImage="aymara/nind-debian11:build"
             packageDir=/usr/share/apps/nind/packages/
             cicd/extract_package.sh $dockerImage $packageDir $GITHUB_OUTPUT
             ls ./*.deb
      - name: Upload nightly build package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          gh release create --prerelease --generate-notes nightly ./${{ steps.extract.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release package
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ steps.extract.outputs.version }}
          files: |
            ./${{ steps.extract.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #========================================================================
  ubuntu22_04_nind:
    name: "Build the package for Ubuntu 22.04"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - name: Build image
        run: docker build -f ./Dockerfile-ubuntu22.04 -t aymara/nind-ubuntu22.04:build .
      - name: Extract package and version number from docker iamge
        id: extract
        shell: bash
        run: |
             dockerImage="aymara/nind-ubuntu22.04:build" 
             packageDir=/usr/share/apps/nind/packages/
             cicd/extract_package.sh $dockerImage $packageDir $GITHUB_OUTPUT
      - name: Upload nightly build package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          gh release create --prerelease --generate-notes nightly ./${{ steps.extract.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release package
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ steps.extract.outputs.version }}
          files: |
            ./${{ steps.extract.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
