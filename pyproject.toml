[project]
name = "nind"
version = "2.0.1"
description = "Python frontend for the Nind Indexing Module"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py/nind"]

[tool.pytest.ini_options]
testpaths = ["tst/py"]
pythonpath = ["src/py"]
